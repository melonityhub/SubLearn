name: Android CI

# Verification gate for this repo (see docs/DECISIONS.md D-008). Every change to the
# arena branch and every PR into main must pass this workflow.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --continue 2>&1 | tee gradle-test.log

      - name: Report failures as annotations
        if: failure()
        run: python3 .github/scripts/report_failures.py gradle-test.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            gradle-test.log
          if-no-files-found: ignore
          retention-days: 7
