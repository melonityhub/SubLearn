name: Release

# Pushing a tag like v0.1.0 builds the debug APK and publishes it as a GitHub Release (D-025).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          cp app/build/outputs/apk/debug/app-debug.apk "SubLearn-${TAG}-debug.apk"
          gh release create "$TAG" "SubLearn-${TAG}-debug.apk" \
            --title "SubLearn ${TAG}" \
            --notes "Debug build for sideloading. See CHANGELOG.md. Built from commit ${GITHUB_SHA}." \
            --verify-tag || gh release upload "$TAG" "SubLearn-${TAG}-debug.apk" --clobber
